openapi: "3.1.0"
info:
  title: "socialize API"
  description: "socialize API"
  version: "1.0.0"
servers:
  - url: "https://socialize"
paths:
  /api/v1.0/alexa:
    post:
      summary: "POST api/v1.0/alexa"
      operationId: "readTasksViaAlexa"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlexaRO"
          application/xml:
            schema:
              $ref: "#/components/schemas/AlexaRO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AlexaRO"
  /api/v1.0/auth:
    get:
      summary: "GET api/v1.0/auth"
      operationId: "getInfo"
      parameters:
        - name: "name"
          in: "query"
          required: false
          schema:
            type: "string"
            default: "Student"
      responses:
        "200":
          description: "OK"
  /api/v1.0/auth/attendees:
