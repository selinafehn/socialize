  /api/v1.0/dashboard/addVoting:
    post:
      summary: "POST api/v1.0/dashboard/addVoting"
      operationId: "createVoting"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVoting"
          application/xml:
            schema:
              $ref: "#/components/schemas/CreateVoting"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "string"
  /api/v1.0/dashboard/create:
    post:
      summary: "POST api/v1.0/dashboard/create"
      operationId: "meetupCreate"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Meetupcreate"
          application/xml:
            schema:
              $ref: "#/components/schemas/Meetupcreate"
        required: true
      responses:
        "200":
          description: "OK"
          content:
