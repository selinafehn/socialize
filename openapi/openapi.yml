components:
  schemas:
    IntentRO:
      type: "object"
      properties:
        name:
          type: "string"
    RequestRO:
      type: "object"
      properties:
        type:
          type: "string"
        requestId:
          type: "string"
        intent:
          $ref: "#/components/schemas/IntentRO"
        locale:
          type: "string"
        timestamp:
          type: "string"
    OutputSpeechRO:
      type: "object"
      properties:
        type:
          type: "string"
        text:
          type: "string"
    ResponseRO:
      type: "object"
      properties:
        outputSpeech:
          $ref: "#/components/schemas/OutputSpeechRO"
        shouldEndSession:
          type: "boolean"
    SessionRO:
      type: "object"
      properties: { }
    ContextRO:
      type: "object"
      properties: { }
    AlexaRO:
      type: "object"
      properties:
        request:
          $ref: "#/components/schemas/RequestRO"
        response:
          $ref: "#/components/schemas/ResponseRO"
        version:
          type: "string"
        session:
          $ref: "#/components/schemas/SessionRO"
        context:
          $ref: "#/components/schemas/ContextRO"
    Attendees:
      type: "object"
      properties: { }
    Userlogin:
      type: "object"
      properties:
        email:
          type: "string"
        password:
          type: "string"
    SendBackToken:
      type: "object"
      properties:
        token:
          type: "string"
        validInSeconds:
          type: "integer"
          format: "int64"
        userID:
          type: "string"
    Userlogoff:
      type: "object"
      properties:
        token:
          type: "string"
    Meetup:
      type: "object"
      properties: { }
    CreateUser:
      type: "object"
      properties:
        firstname:
          type: "string"
        lastname:
          type: "string"
        password:
          type: "string"
        email:
          type: "string"
        token:
          type: "string"
        validuntil:
          type: "integer"
          format: "int64"
    User:
      type: "object"
      properties: { }
    Voting:
      type: "object"
      properties: { }
    CreateMeetup:
      type: "object"
      properties:
        meetupID:
          type: "string"
        title:
          type: "string"
        friends:
          type: "string"
        option:
          type: "string"
        location:
          type: "string"
        validuntil:
          type: "integer"
          format: "int64"
        description:
          type: "string"
    CreateAttendee:
      type: "object"
      properties:
        relID:
          type: "string"
        userID:
          type: "string"
        meetupID:
          type: "string"
        host:
          type: "boolean"
    Timestamp:
      type: "object"
      properties:
        nanos:
          type: "integer"
          format: "int32"
    CreateOptions:
      type: "object"
      properties:
        optionid:
          type: "string"
        optionserial:
          type: "string"
        meetupid:
          type: "string"
        dateandtime:
          $ref: "#/components/schemas/Timestamp"
    CreateVoting:
      type: "object"
      properties:
        voteid:
          type: "string"
        userid:
          type: "string"
        meetupid:
          type: "string"
        opt1:
          type: "boolean"
        opt2:
          type: "boolean"
        opt3:
          type: "boolean"
        opt4:
          type: "boolean"
        opt5:
          type: "boolean"
        opt6:
          type: "boolean"
        opt7:
          type: "boolean"
    Meetupcreate:
      type: "object"
      properties:
        title:
          type: "string"
        friends:
          type: "string"
        date:
          type: "string"
        place:
          type: "string"
        specification:
          type: "string"
        timerange:
          type: "string"
        token:
          type: "string"
        description:
          type: "string"
    Meetupdelete:
      type: "object"
      properties:
        userID:
          type: "string"
        meetupID:
          type: "string"
    Meetupedit:
      type: "object"
      properties:
        title:
          type: "string"
        friends:
          type: "array"
          items:
            type: "string"
        date:
          type: "string"
        place:
          type: "string"
        specification:
          type: "string"
        timerange:
          type: "string"
        meetupID:
          type: "string"
        userId:
          type: "string"
        description:
          type: "string"
    Meetupoverview:
      type: "object"
      properties:
        token:
          type: "string"
    Meetupshow:
      type: "object"
      properties:
        meetupID:
          type: "string"
        token:
          type: "string"